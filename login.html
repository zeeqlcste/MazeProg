<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MazeProg - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <form class="auth-card" id="loginForm">
      <a class="site-brand site-brand--auth" href="index.html" aria-label="MazeProg home"><img src="assets/mazeprog-logo.png" alt="MazeProg"></a>
      <h2>Login</h2>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary">Log In</button>
      <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
    </form>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
