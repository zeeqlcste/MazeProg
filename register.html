<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MazeProg - Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <form class="auth-card" id="registerForm">
      <a class="site-brand site-brand--auth" href="index.html" aria-label="MazeProg home"><img src="assets/mazeprog-logo.png" alt="MazeProg"></a>
      <h2>Create an Account</h2>
      
      <div class="form-group">
        <label for="username">Full Name</label>
        <input type="text" id="username" required placeholder="John Doe">
      </div>

      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" required placeholder="••••••••">
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" required>
          <option value="student">Student</option>
          <option value="lecturer">Lecturer</option>
        </select>
      </div>

      <!-- Fields specific to Student -->
      <div id="studentFields">
        <div class="form-group">
          <label for="studentFaculty">Faculty</label>
          <input type="text" id="studentFaculty" placeholder="e.g., FSKM">
        </div>
        <div class="form-group">
          <label for="course">Course</label>
          <input type="text" id="course" placeholder="e.g., CS110">
        </div>
        <div class="form-group">
          <label for="semester">Semester</label>
          <input type="number" id="semester" placeholder="e.g., 3">
        </div>
        <div class="form-group">
          <label for="class">Class</label>
          <input type="text" id="class" placeholder="e.g., RCS1103A">
        </div>
      </div>

      <!-- Fields specific to Lecturer -->
      <div id="lecturerFields" style="display: none;">
        <div class="form-group">
          <label for="lecturerFaculty">Faculty</label>
          <input type="text" id="lecturerFaculty" placeholder="e.g., FSKM">
        </div>
        <div class="form-group">
          <label for="department">Department</label>
          <input type="text" id="department" placeholder="e.g., Computer Science">
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Register Account</button>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
