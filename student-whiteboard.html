<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MazeProg - Student Interactive Whiteboard
    </title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            background: #0f172a;
            color: #fff;

            font-family: Arial, sans-serif;

            height: 100vh;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        /* HEADER */

        .wb-header {

            height: 60px;

            background: #1e293b;

            border-bottom:
                1px solid #334155;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            padding: 0 20px;

            z-index: 10;
        }


        .wb-title-group {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .badge-pin {

            background: #10b981;

            color: #0f172a;

            font-weight: bold;

            padding: 4px 10px;

            border-radius: 6px;

            font-size: 14px;

            letter-spacing: 1px;
        }


        .badge-live {

            background: #ef4444;

            color: #fff;

            font-size: 11px;

            font-weight: bold;

            padding: 3px 8px;

            border-radius: 4px;

            animation:
                pulse 1.5s infinite;

            display: inline-flex;

            align-items: center;

            gap: 4px;
        }


        /* WHITEBOARD */

        .board-container {

            flex: 1;

            position: relative;

            background: #020617;

            width: 100%;

            height:
                calc(100vh - 60px);

            overflow: hidden;
        }


        canvas {

            display: block;

            background: #020617;

            cursor: not-allowed;

            width: 100%;

            height: 100%;
        }

        .shared-code-card {
            position: absolute;
            z-index: 4;
            top: 18px;
            left: 18px;
            width: min(620px, calc(100% - 36px));
            max-height: calc(100% - 36px);
            overflow: auto;
            color: #ecf5ef;
            background: rgba(10, 17, 14, 0.95);
            border: 1px solid rgba(96, 214, 174, 0.45);
            border-radius: 8px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }

        .shared-code-card[hidden] { display: none; }
        .shared-code-card header { height: auto; padding: 10px 14px; border-bottom: 1px solid #31453a; color: #d8b977; font-size: 12px; }
        .shared-code-card pre { margin: 0; padding: 16px; overflow: auto; color: #d7f4e6; font: 15px/1.6 'Cascadia Code', Consolas, monospace; white-space: pre; }
        .student-note { position: absolute; z-index: 5; width: 190px; min-height: 120px; padding: 12px; border-radius: 6px; color: #16211b; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25); }
        .student-note small { display: block; margin-top: 12px; color: inherit; opacity: 0.7; text-align: right; }
        .board-container { background-color: #09110e; background-image: linear-gradient(rgba(96, 214, 174, 0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(96, 214, 174, 0.045) 1px, transparent 1px); background-size: 28px 28px; }
        .board-container canvas { background: transparent; }
        body.projector-mode .wb-header { display: none; }
        body.projector-mode .board-container { height: 100vh; }
        @media (max-width: 600px) { .shared-code-card { top: 8px; left: 8px; width: calc(100% - 16px); } }


        /* EXIT BUTTON */

        .btn-leave {

            background: #334155;

            color: #f8fafc;

            border:
                1px solid #475569;

            padding: 6px 14px;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;

            font-size: 13px;

            transition:
                all 0.2s;
        }


        .btn-leave:hover {

            background: #ef4444;

            color: #fff;

            border-color:
                #ef4444;
        }


        /* LIVE ANIMATION */

        @keyframes pulse {

            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="wb-header">

        <div class="wb-title-group">

            <a class="site-brand site-brand--micro" href="student-dashboard.html" aria-label="MazeProg student dashboard">
                <img src="assets/mazeprog-logo.png" alt="MazeProg">
            </a>

            <span class="badge-pin">

                PIN:

                <span id="displayPin">
                    ------
                </span>

            </span>


            <h2
                id="displayTitle"
                style="
                    font-size: 16px;
                    color: #f8fafc;
                    font-weight: bold;
                "
            >
                Loading Session...
            </h2>


            <span class="badge-live">

                ● LIVE SYNC

            </span>

        </div>


        <div
            style="
                display: flex;
                align-items: center;
                gap: 15px;
            "
        >

            <span
                style="
                    font-size: 13px;
                    color: #94a3b8;
                "
            >

                Student:

                <strong
                    id="displayName"
                    style="color: #38bdf8;"
                >
                    -
                </strong>

            </span>


            <button
                id="leaveBtn"
                class="btn-leave"
            >
                🚪 Exit Session
            </button>

        </div>

    </header>


    <!-- WHITEBOARD -->

    <main
        class="board-container"
        id="boardContainer"
    >

        <canvas
            id="whiteboardCanvas"
        ></canvas>

        <section id="sharedCodeCard" class="shared-code-card" hidden aria-live="polite">
            <header><span id="sharedCodeTitle">C++ code</span><span id="sharedCodeLanguage">C++</span></header>
            <pre id="sharedCodeText"></pre>
        </section>

        <div id="studentNotesLayer" aria-live="polite"></div>

    </main>


    <!-- STUDENT JAVASCRIPT -->

    <script
        type="module"
        src="js/student-whiteboard.js"
    ></script>


</body>

</html>
