<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MazeProg - Lecturer Profile</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #090d16; color: #fff; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .profile-panel { width: 100%; max-width: 620px; background: #111827; border: 1px solid #334155; border-radius: 10px; padding: 28px; }
    .profile-heading { margin: 0 0 22px; text-align: center; font-size: 21px; }
    .avatar-picker { width: 112px; height: 112px; position: relative; margin: 0 auto 22px; cursor: pointer; }
    .avatar-picker img, .avatar-initials { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #38bdf8; object-fit: cover; background: #030712; }
    .avatar-picker img[hidden], .avatar-initials[hidden] { display: none; }
    .avatar-initials { display: grid; place-items: center; color: #bae6fd; font-size: 34px; font-weight: 700; }
    .avatar-overlay { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; background: rgba(0, 0, 0, 0.65); opacity: 0; transition: opacity 0.2s; font-size: 12px; text-align: center; }
    .avatar-picker:hover .avatar-overlay, .avatar-picker:focus-within .avatar-overlay { opacity: 1; }
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .profile-field { display: grid; gap: 6px; }
    .profile-field label { color: #aebaca; font-size: 12px; }
    .profile-field input { width: 100%; min-height: 40px; border: 1px solid #475569; border-radius: 5px; padding: 9px 10px; background: #030712; color: #f8fafc; }
    .profile-field input:disabled { opacity: 0.6; }
    .profile-actions { display: grid; gap: 9px; margin-top: 22px; }
    .profile-actions button { min-height: 42px; cursor: pointer; }
    .profile-save { border: 0; border-radius: 5px; background: #0284c7; color: white; font-weight: 700; }
    .profile-back { border: 1px solid #475569; border-radius: 5px; background: transparent; color: #e2e8f0; }
    .profile-logout { border: 1px solid #7f1d1d; border-radius: 5px; background: transparent; color: #fca5a5; }
    #profileStatus { min-height: 20px; margin-top: 12px; color: #94a3b8; text-align: center; font-size: 13px; }
    @media (max-width: 560px) { .profile-panel { padding: 20px; } .profile-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="lecturer-page lecturer-profile-page">
  <main class="profile-panel">
    <a class="site-brand site-brand--compact" href="lecturer-dashboard.html" aria-label="MazeProg lecturer dashboard"><img src="assets/mazeprog-logo.png" alt="MazeProg"></a>
    <h1 class="profile-heading">Lecturer Profile</h1>

    <label class="avatar-picker" for="profileImageInput" title="Change profile photo">
      <img id="profileImagePreview" alt="Profile photo" hidden>
      <span id="profileInitials" class="avatar-initials">L</span>
      <span class="avatar-overlay">Change photo</span>
    </label>
    <input id="profileImageInput" type="file" accept="image/*" hidden>

    <form id="lecturerProfileForm">
      <div class="profile-grid">
        <div class="profile-field">
          <label for="lecturerName">Full name</label>
          <input id="lecturerName" type="text" required autocomplete="name">
        </div>
        <div class="profile-field">
          <label for="lecturerEmail">Email (read-only)</label>
          <input id="lecturerEmail" type="email" disabled>
        </div>
        <div class="profile-field">
          <label for="lecturerFaculty">Faculty</label>
          <input id="lecturerFaculty" type="text" autocomplete="organization">
        </div>
        <div class="profile-field">
          <label for="lecturerDepartment">Department</label>
          <input id="lecturerDepartment" type="text">
        </div>
      </div>

      <div class="profile-actions">
        <button class="profile-save" type="submit">Save profile</button>
        <button class="profile-back" id="backToLecturerDashboard" type="button">Back to dashboard</button>
        <button class="profile-logout" id="lecturerLogoutBtn" type="button">Log out</button>
      </div>
      <p id="profileStatus" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script type="module" src="js/lecturer-profile.js"></script>
</body>
</html>
