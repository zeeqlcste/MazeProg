<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MazeProg System - Home</title>
  <link rel="stylesheet" href="css/landingpage.css">
</head>
<body>
  <nav class="navbar">
    <a class="site-brand" href="index.html" aria-label="MazeProg home"><img src="assets/mazeprog-logo.png" alt="MazeProg"></a>
    <div class="nav-links">
      <a href="login.html" class="btn btn-outline">Login</a>
      <a href="register.html" class="btn btn-primary">Register</a>
    </div>
  </nav>

  <main class="hero">
    <!-- LiquidEther canvas container (React component — see components/LiquidEther.jsx).
         Requires a React build environment (Vite/CRA/Next.js) to render. -->
    <div class="liquid-ether-hero" id="liquidEtherRoot" aria-hidden="true"></div>
    <div class="liquid-hero-overlay"></div>

    <!-- Decorative floating maze nodes (pure CSS ambience) -->
    <div class="floating-node n1" aria-hidden="true"></div>
    <div class="floating-node n2" aria-hidden="true"></div>
    <div class="floating-node n3" aria-hidden="true"></div>

    <div class="hero-content">
      <h1>Master Programming Through Mazes</h1>
      <p>MazeProg System helps you understand programming logic and problem-solving interactively through gamification.</p>
      <div class="hero-actions">
        <a href="register.html" class="btn btn-primary btn-lg">Get Started</a>
      </div>
    </div>
  </main>
</body>
</html>
