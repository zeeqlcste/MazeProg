<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MazeProg - Student Waiting Room</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #0f172a;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      position: relative;
      overflow: hidden;
    }

    /* SPOTIFY FLOATING & DRAGGABLE WIDGET */
    .spotify-floating-widget {
      position: fixed;
      top: 20px;
      right: 20px; /* Kedudukan asal di atas kanan skrin */
      width: 320px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      z-index: 9999;
      user-select: none;
    }

    /* BAR HARAM UNTUK TARIK / DRAG */
    .drag-header {
      padding: 6px 12px;
      background: #0f172a;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      cursor: move;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #94a3b8;
      font-weight: bold;
      border-bottom: 1px solid #334155;
    }

    .waiting-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 25px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .pin-badge {
      background: #38bdf8;
      color: #0f172a;
      font-size: 24px;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .session-topic-title {
      font-size: 22px;
      font-weight: bold;
      color: #f8fafc;
      margin: 10px 0;
      line-height: 1.3;
      word-break: break-word;
    }

    .status-text {
      color: #10b981;
      font-size: 14px;
      margin-top: 20px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .pulse-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }

    .btn-leave {
      background: transparent;
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }

    .btn-leave:hover {
      background: #ef4444;
      color: #fff;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
  </style>
</head>
<body>

  <!-- FLOATING SPOTIFY PLAYER (BOLEH DRAG KANAN/KIRI/ATAS/BAWAH) -->
  <div id="spotifyWidget" class="spotify-floating-widget">
    <div id="spotifyWidgetHeader" class="drag-header">
      <span>🎵Spotify  Player</span>
      <span>⋮⋮</span>
    </div>
    <iframe 
      style="border-bottom-left-radius:12px; border-bottom-right-radius:12px; border:0; display:block;" 
      src="https://open.spotify.com/embed/playlist/55uK5SzrwLKGHwLXAN6Xl4?utm_source=generator" 
      width="100%" 
      height="152" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
      loading="lazy">
    </iframe>
  </div>

  <div class="waiting-card">
    <a class="site-brand site-brand--compact" href="student-dashboard.html" aria-label="MazeProg student dashboard"><img src="assets/mazeprog-logo.png" alt="MazeProg"></a>
    <!-- PIN SESSION -->
    <div class="pin-badge">PIN: <span id="displayPin">------</span></div>

    <!-- TOPIC SESSION -->
    <div style="font-size: 12px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;">Session Topic</div>
    <h1 class="session-topic-title" id="displayTitle">Loading Topic...</h1>

    <p style="color: #94a3b8; font-size: 14px; margin: 10px 0 15px 0;">
      Welcome, <strong id="displayName" style="color: #38bdf8;">Student</strong>!
    </p>

    <div style="background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 8px;">
      <div style="font-size: 11px; color: #64748b; text-transform: uppercase;">Theme Selected</div>
      <div id="displayTheme" style="font-size: 14px; font-weight: bold; color: #a855f7; margin-top: 2px;">Standard</div>
    </div>

    <!-- STATUS TUNGGU LECTURER -->
    <div class="status-text">
      <span class="pulse-dot"></span> Waiting for lecturer to launch game...
    </div>

    <!-- BUTANG LEAVE ROOM -->
    <button id="leaveRoomBtn" class="btn-leave">🚪 Leave Room</button>
  </div>

  <script type="module" src="js/student-waiting-room.js"></script>
</body>
</html>
